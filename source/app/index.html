<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>System Monitor</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <table class="root"><tr><td class="root-cell">

        <div class="date">SYSTEM MONITOR</div>

        <div class="section-label">BATTERY</div>
        <div id="battery" class="stat-block">Loading...</div>

        <div class="section-label">MEMORY</div>
        <div id="ram" class="stat-block">Loading...</div>

        <div class="progress-bar" id="ram-bar">
            <div class="progress-bar-fill" id="ram-bar-fill"></div>
        </div>

        <div class="section-label">STORAGE</div>
        <div id="storage" class="stat-block">Loading...</div>

        <div class="progress-bar" id="storage-bar">
            <div class="progress-bar-fill" id="storage-bar-fill"></div>
        </div>

        <div class="section-label">CPU</div>
        <div id="cpu" class="stat-block">Loading...</div>

        <div class="section-label">SYSTEM</div>
        <div id="system" class="stat-block">Loading...</div>

        <div class="section-label">JAILBREAK &amp; TOOLS</div>
        <div id="jailbreak" class="stat-block">Loading...</div>

        <div id="device-line" class="device-line">--</div>
        <div id="status-line" class="status-line">--</div>

    </td></tr></table>
</body>
</html>
